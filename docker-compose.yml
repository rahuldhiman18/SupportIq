# Local prod-like stack: api + Postgres + Mailpit (mail sink for the outbox).
# Run:  docker compose up --build      -> app at http://127.0.0.1:8765
#       docker compose down -v         -> wipe containers + db volume (clean slate)
# 8GB-safe: this file is small on its own; cap WSL2 memory (see .wslconfig) so
# the Docker VM cannot starve Windows.

x-supportiq-environment: &supportiq-environment
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportiq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-supportiq}
  QUERY_MODE: queued
  REDIS_URL: redis://redis:6379/0
  CACHE_KEY_SECRET: ${CACHE_KEY_SECRET:?set CACHE_KEY_SECRET in .env}
  AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-600}
  AI_CACHE_LOCK_SECONDS: ${AI_CACHE_LOCK_SECONDS:-15}
  REFRESH_TOKEN_MINUTES: ${REFRESH_TOKEN_MINUTES:-720}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025

services:
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportiq}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-supportiq}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    build: .
    ports:
      - "8765:8000"          # host 8765 -> container 8000 (approved)
    environment: *supportiq-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    environment:
      <<: *supportiq-environment
      WORKER_ID: ${WORKER_ID:-supportiq-worker}
    command: ["python", "-m", "app.services.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-supportiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Gates the api on a real DB (service_healthy), so alembic never races.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportiq} -d ${POSTGRES_DB:-supportiq}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"          # SMTP (the app sends here)
      - "8025:8025"          # web UI -- see every captured mail, nothing sent for real
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
